<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <text x="60" y="64" font-size="30" font-weight="700" fill="#111827">paper-reading-skill workflow</text>
  <text x="60" y="94" font-size="16" fill="#4b5563">From source PDF to evidence-anchored, mechanism-level paper notes.</text>

  <g>
    <rect x="60" y="130" width="200" height="105" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <text x="80" y="163" font-size="19" font-weight="700" fill="#3730a3">Source</text>
    <text x="80" y="189" font-size="14" fill="#4b5563">PDF / DOI / arXiv</text>
    <text x="80" y="211" font-size="14" fill="#4b5563">publisher HTML / pasted text</text>
  </g>

  <g>
    <rect x="315" y="130" width="200" height="105" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <text x="335" y="163" font-size="19" font-weight="700" fill="#3730a3">Evidence inventory</text>
    <text x="335" y="189" font-size="14" fill="#4b5563">claims · methods · formulas</text>
    <text x="335" y="211" font-size="14" fill="#4b5563">figures · tables · page anchors</text>
  </g>

  <g>
    <rect x="570" y="110" width="230" height="145" rx="18" fill="#111827"/>
    <text x="594" y="145" font-size="20" font-weight="700" fill="#ffffff">Mode router</text>
    <text x="594" y="176" font-size="14" fill="#e0e7ff">通俗精读 / Concise note</text>
    <text x="594" y="203" font-size="14" fill="#e0e7ff">论文精读 / Precision read</text>
    <text x="594" y="230" font-size="14" fill="#e0e7ff">Reader-note calibration</text>
  </g>

  <g>
    <rect x="855" y="130" width="285" height="105" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="877" y="163" font-size="19" font-weight="700" fill="#166534">Precision contract</text>
    <text x="877" y="189" font-size="14" fill="#4b5563">mechanisms · algorithms · formulas</text>
    <text x="877" y="211" font-size="14" fill="#4b5563">original quotes · figure crops · terminology</text>
  </g>

  <g>
    <rect x="180" y="300" width="250" height="90" rx="16" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
    <text x="203" y="333" font-size="18" font-weight="700" fill="#991b1b">QA gate</text>
    <text x="203" y="358" font-size="14" fill="#4b5563">facts · formulas · images</text>
    <text x="203" y="377" font-size="14" fill="#4b5563">quotes · section order · output links</text>
  </g>

  <g>
    <rect x="545" y="300" width="250" height="90" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <text x="568" y="333" font-size="18" font-weight="700" fill="#9a3412">Artifacts</text>
    <text x="568" y="358" font-size="14" fill="#4b5563">Markdown note + original figure crops</text>
    <text x="568" y="377" font-size="14" fill="#4b5563">terminology table · reusable patterns</text>
  </g>

  <g>
    <rect x="900" y="300" width="240" height="90" rx="16" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <text x="923" y="333" font-size="18" font-weight="700" fill="#075985">Calibration loop</text>
    <text x="923" y="358" font-size="14" fill="#4b5563">compare against reader note</text>
    <text x="923" y="377" font-size="14" fill="#4b5563">update rule · regenerate</text>
  </g>

  <path d="M260 182 H309" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M515 182 H564" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M800 182 H849" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M997 240 C997 282 850 300 430 335" stroke="#6366f1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M430 390 C540 410 620 385 795 345" stroke="#6366f1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M795 345 C900 378 950 372 1020 392" stroke="#6366f1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
